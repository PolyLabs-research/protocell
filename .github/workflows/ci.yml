name: CI

on:
  push:
  pull_request:

# Determinism (docs/determinism.md): same seed, same platform, same bits. Linux only for now; a cross-platform claim
# would add a macOS job with a stated tolerance, as quantum-rat's CI has.
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,fast]"
      - name: Run tests
        run: python -m pytest -q
