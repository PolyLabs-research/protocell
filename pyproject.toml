# Packaging for protocell (docs/plan.md). The same stack as quantum-rat: Python 3.11, numpy, pytest.

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "protocell"
version = "0.1.0"
description = "A single cell whose wall and brain are one neural network, evolved to manage light"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "PolyLabs Research"}]
# threadpoolctl lets the manifest record the BLAS kernel and thread count actually in force (docs/determinism.md).
dependencies = [
  "numpy>=2",
  "threadpoolctl>=3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]
# The compiled life (protocell/fast.py): a second engine for the searches. `fast` runs it on the CPU; `gpu` adds
# NVIDIA's compiler and runtime for an Nvidia GPU (the machine then needs only NVIDIA's driver).
fast = ["numba>=0.61"]
# numpy below 2.5 with the GPU: numba-cuda (0.30.4, its newest) still calls numpy.row_stack, which numpy 2.5 removed,
# and fails when it compiles a kernel. Python 3.12 and later would otherwise be given numpy 2.5.
gpu = ["numba>=0.61", "numba-cuda[cu12]>=0.20", "numpy<2.5"]

[project.urls]
Repository = "https://github.com/PolyLabs-research/protocell"

[tool.setuptools]
packages = ["protocell"]
